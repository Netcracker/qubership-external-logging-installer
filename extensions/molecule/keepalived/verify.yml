---
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  vars:
    vip: 172.31.250.250/24
  tasks:
    # The nodes share a bridge that also passes multicast, so check that each node sends VRRP to its peer.
    - name: Read the keepalived config
      ansible.builtin.slurp:
        src: /etc/keepalived/keepalived.conf
      register: keepalived_conf

    - name: Check that the node uses unicast VRRP to its peer
      ansible.builtin.assert:
        that:
          - keepalived_conf_text is search(unicast_block)
        fail_msg: "{{ keepalived_conf_text }}"
        quiet: true
      vars:
        keepalived_conf_text: "{{ keepalived_conf.content | b64decode }}"
        unicast_block: "{{ 'unicast_peer [{][^}]*' ~ (keepalived_unicast_peers[0] | regex_escape) ~ '[^}]*[}]' }}"

    # VRRP elects a master within about three advertisement intervals of one second. The VIP answers from both nodes
    # once one of them holds it, and with nopreempt the holder does not change after that.
    - name: Wait until a node holds the VIP
      ansible.builtin.command: ping -c 1 -W 1 {{ vip.split('/')[0] }}
      register: vip_ping
      changed_when: false
      until: vip_ping.rc == 0
      retries: 15
      delay: 2

    - name: Read the addresses on the VRRP interface
      ansible.builtin.command: ip -4 -o addr show dev eth0
      register: addresses
      changed_when: false

    - name: Find the node that holds the VIP
      ansible.builtin.set_fact:
        vip_holders: >-
          {{ ansible_play_hosts | zip(ansible_play_hosts | map('extract', hostvars, ['addresses', 'stdout']))
             | selectattr('1', 'search', vip) | map('first') | list }}

    - name: Check that exactly one node holds the VIP
      ansible.builtin.assert:
        that:
          - vip_holders | length == 1
        fail_msg: >-
          Nodes that hold {{ vip }}: {{ vip_holders }}. Addresses:
          {{ dict(ansible_play_hosts | zip(ansible_play_hosts | map('extract', hostvars, ['addresses', 'stdout']))) }}
        quiet: true

    - name: Fail the health check on the node that holds the VIP
      ansible.builtin.file:
        path: /tmp/keepalived-check-fail
        state: touch
        mode: "0644"
      when: inventory_hostname == vip_holders[0]

    - name: Wait until the VIP moves to the other node
      ansible.builtin.command: ip -4 -o addr show dev eth0
      register: addresses_after
      changed_when: false
      until: (vip in addresses_after.stdout) == (inventory_hostname != vip_holders[0])
      retries: 15
      delay: 2
      failed_when: false

    - name: Check that the VIP moved to the other node
      ansible.builtin.assert:
        that:
          - (vip in addresses_after.stdout) == (inventory_hostname != vip_holders[0])
        fail_msg: "{{ inventory_hostname }} after 30 seconds: {{ addresses_after.stdout }}"
        quiet: true

    - name: Restore the health check
      ansible.builtin.file:
        path: /tmp/keepalived-check-fail
        state: absent
