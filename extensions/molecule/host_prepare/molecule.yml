---
# Tests the host_prepare role on Ubuntu 24.04 and Rocky 9.
# Run from the extensions/ directory: molecule test -s host_prepare
driver:
  name: docker
platforms:
  - name: host-prepare-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest@sha256:bbf48c50bf652d059118ba025663055ca64f550adaa13405021f418d52a52a84
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    override_command: false
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: host-prepare-rocky9
    image: geerlingguy/docker-rockylinux9-ansible:latest@sha256:370133da77678450c59c78c5ede1a9fec90c87dbe3ba968ab0dcad24b80524c0
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    override_command: false
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../roles
  config_options:
    defaults:
      stdout_callback: default
  inventory:
    group_vars:
      all:
        # Old names on purpose: the role must read them and warn about them.
        ntp_server: "192.0.2.10, 192.0.2.11"
        exporters_system_user: molecule_exporters
        observability_tls_cert_source: selfsigned
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
verifier:
  name: ansible
