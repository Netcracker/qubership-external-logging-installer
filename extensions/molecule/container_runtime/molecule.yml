---
# Tests the container_runtime role on Docker (Ubuntu 24.04) and on rootful Podman (Rocky 9).
# Run from the extensions/ directory: molecule test -s container_runtime
driver:
  name: docker
platforms:
  - name: runtime-docker-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest@sha256:bbf48c50bf652d059118ba025663055ca64f550adaa13405021f418d52a52a84
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    override_command: false
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # The inner engine cannot use overlayfs on top of the container's own overlayfs.
      - /var/lib/docker
    groups:
      - docker_hosts
  - name: runtime-podman-rocky9
    image: geerlingguy/docker-rockylinux9-ansible:latest@sha256:370133da77678450c59c78c5ede1a9fec90c87dbe3ba968ab0dcad24b80524c0
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    override_command: false
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/containers
    groups:
      - podman_hosts
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../roles
  config_options:
    defaults:
      stdout_callback: default
  inventory:
    group_vars:
      all:
        container_runtime_install: true
        container_runtime_networks:
          - name: runtime-test
            mtu: 1400
      docker_hosts:
        observability_container_runtime: docker
        # Docker 29 stores images with the containerd snapshotter, which cannot unpack whiteout files inside this
        # nested container. This also checks that extra daemon.json keys reach the daemon.
        container_runtime_docker_daemon_options:
          storage-driver: overlay2
          features:
            containerd-snapshotter: false
      podman_hosts:
        observability_container_runtime: podman
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
verifier:
  name: ansible
