---
# Keep the secret of an existing installation: a new one would sign out all users and break encrypted values.
# graylog.conf is a Java properties file. The java_properties module reads the value that Graylog reads, and escapes
# graylog_password_secret_effective for the template, so Graylog reads it back unchanged.

# Earlier installer versions documented graylog_custom_params.password_secret. ini_file wrote it into graylog.conf as
# is, so Graylog read it with Java properties escapes applied; read it the same way to keep the same key.
- name: Read graylog_custom_params.password_secret as Graylog read it
  java_properties:
    content: "password_secret = {{ (graylog_custom_params | default({}, true)).password_secret }}"
    key: password_secret
  register: graylog_legacy_setting
  no_log: true
  when: (graylog_custom_params | default({}, true)).password_secret | default('', true) | string | length > 0

- name: Stop when graylog_custom_params.password_secret cannot be read
  ansible.builtin.fail:
    msg: >-
      graylog_custom_params.password_secret cannot be read as Graylog reads graylog.conf:
      {{ graylog_legacy_setting.error | replace('content', 'the setting') }}
      Set graylog_password_secret to the secret of this installation and remove password_secret from
      graylog_custom_params.
  when: graylog_legacy_setting.error is defined

- name: Read the password secrets set in the inventory
  ansible.builtin.set_fact:
    graylog_inventory_secret: "{{ graylog_password_secret | default('', true) | string }}"
    graylog_legacy_secret: "{{ graylog_legacy_setting.value | default('', true) }}"
  no_log: true

- name: Stop when graylog_password_secret and graylog_custom_params.password_secret differ
  ansible.builtin.fail:
    msg: >-
      graylog_password_secret and graylog_custom_params.password_secret set different values, so the role cannot tell
      which secret Graylog must use. Keep the one that this installation uses in graylog_password_secret and remove
      password_secret from graylog_custom_params.
  when:
    - graylog_inventory_secret | length > 0
    - graylog_legacy_secret | length > 0
    - graylog_inventory_secret != graylog_legacy_secret

- name: Choose the explicit Graylog password secret
  ansible.builtin.set_fact:
    graylog_explicit_secret: "{{ graylog_inventory_secret if graylog_inventory_secret | length > 0 else graylog_legacy_secret }}"
  no_log: true

- name: Read the password secret from the existing Graylog config
  java_properties:
    path: "{{ graylog_volume }}/graylog/config/graylog.conf"
    key: password_secret
  register: graylog_existing_config
  no_log: true
  when: graylog_explicit_secret | length == 0

- name: Stop when the existing Graylog config cannot be read
  ansible.builtin.fail:
    msg: >-
      {{ graylog_existing_config.error }} The role cannot tell which password secret Graylog uses. Set
      graylog_password_secret to the secret of this installation.
  when: graylog_existing_config.error is defined

- name: Record the password secret of the existing Graylog config
  ansible.builtin.set_fact:
    graylog_existing_secret: "{{ graylog_existing_config.value | default('', true) }}"
  no_log: true
  when: graylog_existing_config.exists | default(false)

- name: Stop when the existing Graylog config has no password secret
  ansible.builtin.fail:
    msg: >-
      {{ graylog_volume }}/graylog/config/graylog.conf has no password_secret, or its value is empty. Set
      graylog_password_secret to the secret that this installation uses. A new secret signs out all users and makes
      values encrypted with the old secret, such as access tokens, unreadable.
  when:
    - graylog_existing_config.exists | default(false)
    - graylog_existing_secret | length == 0

# Nodes that share one database must share one secret, and the role cannot inspect a database it did not deploy.
- name: Stop when Graylog uses a custom MongoDB and no password secret is known
  ansible.builtin.fail:
    msg: >-
      graylog_custom_params.mongodb_uri points Graylog to a custom MongoDB, and neither graylog_password_secret nor
      {{ graylog_volume }}/graylog/config/graylog.conf sets the password secret. If a Graylog cluster already uses this
      database, set graylog_password_secret to the secret of that cluster: a different secret makes values encrypted
      with it unreadable. For a new cluster, set it to one new random value of at least 64 characters on every node.
  when:
    - graylog_existing_config is not skipped
    - not graylog_existing_config.exists
    - (graylog_custom_params | default({}, true)).mongodb_uri | default('', true) | length > 0

# Check mode does not create the MongoDB container, so a dry run of a fresh install has nothing to ask. Check mode
# writes nothing, so the random secret that it chooses instead is never used.
- name: Check whether the bundled MongoDB holds Graylog data
  ansible.builtin.include_tasks: mongodb_probe.yml
  when:
    - graylog_existing_config is not skipped
    - not graylog_existing_config.exists
    - graylog_mongodb_has_data is not defined
    - not ansible_check_mode

- name: Stop when MongoDB holds Graylog collections but the Graylog config is missing
  ansible.builtin.fail:
    msg: >-
      The graylog database in MongoDB has collections, which Graylog creates on its first start, but
      {{ graylog_volume }}/graylog/config/graylog.conf is missing. Set graylog_password_secret to the secret that this
      installation used. A new secret signs out all users and makes values encrypted with the old secret, such as
      access tokens, unreadable.
  when:
    - graylog_existing_config is not skipped
    - not graylog_existing_config.exists
    - graylog_mongodb_has_data | default(false) | bool

- name: Choose the Graylog password secret
  ansible.builtin.set_fact:
    graylog_password_secret_effective: >-
      {{ graylog_explicit_secret if graylog_explicit_secret | length > 0
         else graylog_existing_secret if graylog_existing_config.exists | default(false)
         else lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=96) }}
  no_log: true

- name: Escape the Graylog password secret for graylog.conf
  java_properties:
    key: password_secret
    escape: "{{ graylog_password_secret_effective }}"
  register: graylog_password_secret_line
  no_log: true

- name: Record the escaped Graylog password secret
  ansible.builtin.set_fact:
    graylog_password_secret_escaped: "{{ graylog_password_secret_line.escaped }}"
  no_log: true

- name: Warn when Graylog uses the password secret that earlier installer versions shipped
  ansible.builtin.debug:
    msg: >-
      graylog.conf uses the password_secret that earlier installer versions set on every installation, so it is
      publicly known. Choose one new random value of at least 64 characters for the whole Graylog cluster, and set it
      as graylog_password_secret on all of its nodes at the same time. Changing it signs out all users and makes values
      encrypted with the old secret, such as access tokens, unreadable.
  when: >-
    graylog_password_secret_effective | hash('sha256')
    == '962fd74cb98aae5dc21e19290d3f90c2d0a2359ac113563049efa73229150617'
