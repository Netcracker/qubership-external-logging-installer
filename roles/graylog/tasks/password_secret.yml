---
# Keep the secret of an existing installation: a new one would sign out all users and break encrypted values.
# graylog.conf is a Java properties file, so the key may be indented, the separator may be "=", ":", or whitespace, the
# value runs to the end of the line, spaces included, and a line may end in LF, CRLF, or CR.

# Earlier installer versions documented graylog_custom_params.password_secret, so both settings count as explicit.
- name: Collect the password secrets set in the inventory
  ansible.builtin.set_fact:
    graylog_explicit_secrets: >-
      {{ [graylog_password_secret | default('', true),
          (graylog_custom_params | default({}, true)).password_secret | default('', true)]
         | map('string') | select | unique }}
  no_log: true

- name: Stop when graylog_password_secret and graylog_custom_params.password_secret differ
  ansible.builtin.fail:
    msg: >-
      graylog_password_secret and graylog_custom_params.password_secret set different values, so the role cannot tell
      which secret Graylog must use. Remove password_secret from graylog_custom_params and keep graylog_password_secret.
  when: graylog_explicit_secrets | length > 1

- name: Choose the explicit Graylog password secret
  ansible.builtin.set_fact:
    graylog_explicit_secret: "{{ graylog_explicit_secrets | first | default('') }}"
  no_log: true

# The template writes the value as is, and Java properties read a backslash as an escape and drop leading whitespace.
- name: Stop when the explicit password secret does not survive graylog.conf unchanged
  ansible.builtin.fail:
    msg: >-
      The explicit Graylog password secret contains a backslash or a line break, or starts with whitespace, so Graylog
      would read a different value from graylog.conf. Use letters and digits only, for example the output of
      pwgen -N 1 -s 96.
  when: >-
    '\\' in graylog_explicit_secret or '\r' in graylog_explicit_secret or '\n' in graylog_explicit_secret
    or graylog_explicit_secret is match('[ \t\f]')

- name: Check for an existing Graylog config
  ansible.builtin.stat:
    path: "{{ graylog_volume }}/graylog/config/graylog.conf"
  register: graylog_existing_config_stat
  when: graylog_explicit_secret | length == 0

- name: Read the existing Graylog config
  ansible.builtin.slurp:
    src: "{{ graylog_volume }}/graylog/config/graylog.conf"
  register: graylog_existing_config
  no_log: true
  when:
    - graylog_existing_config_stat is not skipped
    - graylog_existing_config_stat.stat.exists

- name: Find the password secret in the existing Graylog config
  ansible.builtin.set_fact:
    # The last definition wins, as in java.util.Properties.
    graylog_existing_secret: >-
      {{ ((graylog_existing_config.content | b64decode | regex_replace('\r\n?', '\n')
           | regex_findall('(?m)^[ \t\f]*password_secret(?:[ \t\f]*[=:]|[ \t\f])[ \t\f]*([^\n]*)$'))
          | default([''], true)) | last }}
  no_log: true
  when: graylog_existing_config.content is defined

# A trailing backslash continues the value on the next line, which this role cannot write back.
- name: Stop when the existing Graylog config has no password secret that the role can keep
  ansible.builtin.fail:
    msg: >-
      Cannot read password_secret from {{ graylog_volume }}/graylog/config/graylog.conf: the key is missing, empty, or
      continues on the next line. Set graylog_password_secret to the secret that this installation uses. A new secret
      signs out all users and makes values encrypted with the old secret, such as access tokens, unreadable.
  when:
    - graylog_existing_config.content is defined
    - >-
      graylog_existing_secret | length == 0
      or (graylog_existing_secret | length - graylog_existing_secret | regex_replace('\\\\+$', '') | length) is odd

# graylog_mongodb_has_data comes from pre_deploy.yml, which asks MongoDB before this file runs.
- name: Stop when MongoDB holds Graylog data but the Graylog config is missing
  ansible.builtin.fail:
    msg: >-
      MongoDB holds data of an earlier Graylog installation, but {{ graylog_volume }}/graylog/config/graylog.conf is
      missing. Set graylog_password_secret to the secret that this installation used. A new secret signs out all users
      and makes values encrypted with the old secret, such as access tokens, unreadable.
  when:
    - graylog_existing_config_stat is not skipped
    - not graylog_existing_config_stat.stat.exists
    - graylog_mongodb_has_data | default(false) | bool

- name: Choose the Graylog password secret
  ansible.builtin.set_fact:
    graylog_password_secret_effective: >-
      {{ graylog_explicit_secret if graylog_explicit_secret | length > 0
         else graylog_existing_secret if graylog_existing_config.content is defined
         else lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=96) }}
  no_log: true

- name: Warn when Graylog uses the password secret that earlier installer versions shipped
  ansible.builtin.debug:
    msg: >-
      graylog.conf uses the password_secret that earlier installer versions set on every installation, so it is
      publicly known. Set graylog_password_secret to a unique random value of at least 64 characters. Changing it
      signs out all users and makes values encrypted with the old secret, such as access tokens, unreadable.
  when: >-
    graylog_password_secret_effective | hash('sha256')
    == '962fd74cb98aae5dc21e19290d3f90c2d0a2359ac113563049efa73229150617'
