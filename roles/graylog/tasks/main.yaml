- name: Install Graylog
  block:
    - ansible.builtin.import_tasks: manage_plugins.yml
    - ansible.builtin.import_tasks: pre_deploy.yml
    - ansible.builtin.import_tasks: manage_certificates.yml
    - ansible.builtin.import_tasks: prepare_of_containers_parameters.yml
    - ansible.builtin.import_tasks: run_docker.yml
  when: graylog_install|bool

- name: Uninstall Graylog
  block:
    - ansible.builtin.import_tasks: uninstall.yml
  when: not graylog_install|bool
