---
- name: Resolve cAdvisor download URL
  # A custom URL wins. A full URL in cadvisor_binary is used as is; a relative path is joined to raw_artifacts_registry.
  ansible.builtin.set_fact:
    cadvisor_binary_url: >-
      {{ cadvisor_custom_binary
         if (cadvisor_custom_binary is defined and cadvisor_custom_binary is not none and cadvisor_custom_binary | length > 0)
         else (cadvisor_binary
               if (cadvisor_binary is match('https?://') or raw_artifacts_registry is not defined or raw_artifacts_registry is none)
               else raw_artifacts_registry ~ '/' ~ cadvisor_binary) }}

# Registry credentials and TLS settings apply only to the origin of raw_artifacts_registry. Downloads from anywhere
# else, such as the public release URL, send no credentials and always verify TLS.
- name: Check whether cadvisor downloads from raw_artifacts_registry
  ansible.builtin.include_role:
    name: common
    tasks_from: raw_artifacts_origin.yml
  vars:
    common_raw_artifacts_url: "{{ cadvisor_binary_url }}"

- name: Download cAdvisor binary
  ansible.builtin.get_url:
    url: "{{ cadvisor_binary_url }}"
    dest: "/tmp/cadvisor"
    url_username: "{{ raw_artifacts_registry_username | default(omit, true) if common_raw_artifacts_from_registry | bool else omit }}"
    url_password: "{{ raw_artifacts_registry_password | default(omit, true) if common_raw_artifacts_from_registry | bool else omit }}"
    validate_certs: "{{ raw_artifacts_registry_validate_certs | bool if common_raw_artifacts_from_registry | bool else true }}"
  environment: >-
    {{ {'SSL_CERT_FILE': ssl_data_host_path ~ '/' ~ raw_artifacts_registry_ca_cert_file}
       if common_raw_artifacts_from_registry | bool and raw_artifacts_registry_validate_certs | bool
          and raw_artifacts_registry_ca_cert_file | default('', true) | length > 0
       else {} }}
  register: _download_tarball
  until: _download_tarball is succeeded
  retries: 5
  delay: 2

- name: Propagate cAdvisor binary
  ansible.builtin.copy:
    src: /tmp/cadvisor
    dest: "{{ cadvisor_host_bin_dir }}/cadvisor"
    remote_src: yes
    mode: 0750
    owner: "{{ exporters_system_user }}"
    group: "{{ exporters_system_group }}"
    force: yes
  notify: Restart cAdvisor service

- name: Copy cAdvisor systemd service file
  ansible.builtin.template:
    src: cadvisor.service.jinja
    dest: /etc/systemd/system/cadvisor.service
    owner: root
    group: root
    mode: 0644
  notify: Restart cAdvisor service
  when: not cadvisor_keep_custom_config|bool

- name: Start and enable cAdvisor service
  ansible.builtin.systemd:
    name: cadvisor
    enabled: yes
    state: started
    daemon_reload: yes
