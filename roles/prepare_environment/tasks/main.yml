---
- ansible.builtin.import_tasks: check_prerequisites.yml
- ansible.builtin.import_tasks: configure_ntp.yml
  when:
    - ntp_server is defined
    - ntp_server is not none
    - ntp_server | trim | length > 0
- ansible.builtin.import_tasks: configure_keepalived.yml
- ansible.builtin.import_tasks: docker_configuring.yml
