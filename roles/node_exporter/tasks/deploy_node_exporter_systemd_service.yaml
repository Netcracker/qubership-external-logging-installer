---
- name: Resolve node_exporter download URL
  # A custom URL wins. A full URL in node_exporter_tarball is used as is; a relative path is joined to
  # raw_artifacts_registry, which counts as https:// when it has no scheme, as in the origin check.
  ansible.builtin.set_fact:
    node_exporter_tarball_url: >-
      {{ node_exporter_custom_tarball
         if (node_exporter_custom_tarball is defined and node_exporter_custom_tarball is not none and node_exporter_custom_tarball | length > 0)
         else (node_exporter_tarball
               if (node_exporter_tarball is match('https?://') or raw_artifacts_registry is not defined or raw_artifacts_registry is none)
               else (raw_artifacts_registry | regex_replace('^(?![A-Za-z][A-Za-z0-9+.-]*://)', 'https://')) ~ '/' ~ node_exporter_tarball) }}

- name: Set default node-exporter flags
  ansible.builtin.set_fact:
    node_exporter_default_flags:
      - "--path.procfs=/proc"
      - "--path.sysfs=/sys"
      - '--path.rootfs=/'
      - "--collector.filesystem.ignored-mount-points={{ node_exporter_ignored_mount_points }}"
      - "--web.listen-address=:{{ node_exporter_listen_port }}"
      - "--web.telemetry-path={{ node_exporter_telemetry_path }}"
      - "--collector.systemd"

- name: Compile custom and default node-exporter flags
  ansible.builtin.set_fact:
    node_exporter_flags: "{{ node_exporter_flags + node_exporter_default_flags }}"

# Registry credentials and TLS settings apply only to the origin of raw_artifacts_registry. Downloads from anywhere
# else, such as the public release URL, send no credentials and always verify TLS.
- name: Check whether node_exporter downloads from raw_artifacts_registry
  ansible.builtin.include_role:
    name: common
    tasks_from: raw_artifacts_origin.yml
  vars:
    common_raw_artifacts_url: "{{ node_exporter_tarball_url }}"

- name: Download node_exporter tarball
  ansible.builtin.get_url:
    url: "{{ node_exporter_tarball_url }}"
    dest: "/tmp/node_exporter.tar.gz"
    url_username: "{{ raw_artifacts_registry_username | default(omit, true) if common_raw_artifacts_from_registry | bool else omit }}"
    url_password: "{{ raw_artifacts_registry_password | default(omit, true) if common_raw_artifacts_from_registry | bool else omit }}"
    validate_certs: "{{ raw_artifacts_registry_validate_certs | bool if common_raw_artifacts_from_registry | bool else true }}"
  environment: >-
    {{ {'SSL_CERT_FILE': ssl_data_host_path ~ '/' ~ raw_artifacts_registry_ca_cert_file}
       if common_raw_artifacts_from_registry | bool and raw_artifacts_registry_validate_certs | bool
          and raw_artifacts_registry_ca_cert_file | default('', true) | length > 0
       else {} }}
  register: _download_tarball
  until: _download_tarball is succeeded
  retries: 5
  delay: 2

- name: Unarchive Node-exporter binary
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter.tar.gz"
    dest: /tmp
    remote_src: yes
    extra_opts: [--strip-components=1]

- name: Propagate Node-exporter binary
  ansible.builtin.copy:
    src: /tmp/node_exporter
    dest: "{{ node_exporter_host_bin_dir }}/node_exporter"
    remote_src: yes
    mode: 0750
    owner: "{{ exporters_system_user }}"
    group: "{{ exporters_system_group }}"
    force: yes
  notify: Restart Node-exporter service

- name: Copy Node-exporter systemd service file
  ansible.builtin.template:
    src: node_exporter.service.jinja
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: 0644
  notify: Restart Node-exporter service

- name: Start and enable Node-exporter service
  ansible.builtin.systemd:
    name: node_exporter
    enabled: yes
    state: started
    daemon_reload: yes
