- name: Get user account 'operator'
  ansible.builtin.uri:
    url: https://localhost/api/users/operator
    validate_certs: false
    user: admin
    password: "{{ root_password }}"
    force_basic_auth: true
    method: GET
    timeout: "{{ response_timeout }}"
    status_code: [200, 404]
    headers:
      Accept: application/json
    return_content: true
  register: operator

- name: Create 'operator' user
  ansible.builtin.uri:
    url: https://localhost/api/users
    validate_certs: false
    user: admin
    password: "{{ root_password }}"
    force_basic_auth: true
    method: POST
    timeout: "{{ response_timeout }}"
    status_code: 201
    headers:
      X-Requested-By: Graylog API Browser
    body: "{{ lookup('template', '{{ role_path }}/files/user_accounts/operator.json.j2', template_vars=template_vars) }}"
    body_format: json
  when:
    - operator.status == 404
  vars:
    template_vars:
      password: "{{ operator_password }}"

- name: Update 'operator' user
  ansible.builtin.uri:
    url: https://localhost/api/users/{{ operator_user_id }}
    validate_certs: false
    user: admin
    password: "{{ root_password }}"
    force_basic_auth: true
    method: PUT
    timeout: "{{ response_timeout }}"
    status_code: 204
    headers:
      X-Requested-By: Graylog API Browser
    body: "{{ lookup('template', '{{ role_path }}/files/user_accounts/operator.json.j2', template_vars=template_vars) }}"
    body_format: json
  when:
    - update_content | bool
    - operator.status == 200
  vars:
    template_vars:
      password: "{{ operator_password }}"

