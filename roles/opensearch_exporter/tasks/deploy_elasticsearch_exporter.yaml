---
- name: Resolve elasticsearch_exporter download URL
  # A custom URL wins. A full URL in elasticsearch_exporter_tarball is used as is; a relative path is joined to
  # raw_artifacts_registry, which counts as https:// when it has no scheme, as in the origin check.
  ansible.builtin.set_fact:
    elasticsearch_exporter_tarball_url: >-
      {{ elasticsearch_exporter_custom_tarball
         if (elasticsearch_exporter_custom_tarball is defined and elasticsearch_exporter_custom_tarball is not none and elasticsearch_exporter_custom_tarball | length > 0)
         else (elasticsearch_exporter_tarball
               if (elasticsearch_exporter_tarball is match('https?://') or raw_artifacts_registry is not defined or raw_artifacts_registry is none)
               else (raw_artifacts_registry | regex_replace('^(?![A-Za-z][A-Za-z0-9+.-]*://)', 'https://')) ~ '/' ~ elasticsearch_exporter_tarball) }}

# Registry credentials and TLS settings apply only to the origin of raw_artifacts_registry. Downloads from anywhere
# else, such as the public release URL, send no credentials and always verify TLS.
- name: Check whether elasticsearch_exporter downloads from raw_artifacts_registry
  ansible.builtin.include_role:
    name: common
    tasks_from: raw_artifacts_origin.yml
  vars:
    common_raw_artifacts_url: "{{ elasticsearch_exporter_tarball_url }}"

- name: Download elasticsearch_exporter archive
  ansible.builtin.get_url:
    url: "{{ elasticsearch_exporter_tarball_url }}"
    dest: "/tmp/elasticsearch_exporter.tar.gz"
    url_username: "{{ raw_artifacts_registry_username | default(omit, true) if common_raw_artifacts_from_registry | bool else omit }}"
    url_password: "{{ raw_artifacts_registry_password | default(omit, true) if common_raw_artifacts_from_registry | bool else omit }}"
    validate_certs: "{{ raw_artifacts_registry_validate_certs | bool if common_raw_artifacts_from_registry | bool else true }}"
  environment: >-
    {{ {'SSL_CERT_FILE': ssl_data_host_path ~ '/' ~ raw_artifacts_registry_ca_cert_file}
       if common_raw_artifacts_from_registry | bool and raw_artifacts_registry_validate_certs | bool
          and raw_artifacts_registry_ca_cert_file | default('', true) | length > 0
       else {} }}
  register: _download_archive
  until: _download_archive is succeeded
  retries: 5
  delay: 2

- name: Unarchive elasticsearch-exporter binary
  ansible.builtin.unarchive:
    src: "/tmp/elasticsearch_exporter.tar.gz"
    dest: /tmp
    remote_src: yes
    extra_opts: [--strip-components=1]

- name: Propagate elasticsearch-exporter binary
  ansible.builtin.copy:
    src: /tmp/elasticsearch_exporter
    dest: "{{ elasticsearch_exporter_host_bin_dir }}/elasticsearch_exporter"
    remote_src: yes
    mode: 0750
    owner: "{{ exporters_system_user }}"
    group: "{{ exporters_system_group }}"
    force: yes
  notify: Restart Elasticsearch exporter

- name: Discover credentials for elasticsearch-exporter
  when:
    - elasticsearch_exporter_admin_username is not defined
    - elasticsearch_exporter_admin_password is not defined
  block:
    - name: Set elasticsearch-exporter credentials from OpenSearch parameters
      ansible.builtin.set_fact:
        elasticsearch_exporter_admin_username: "{{ opensearch_admin_username }}"
        elasticsearch_exporter_admin_password: "{{ opensearch_admin_password }}"
      when:
        - opensearch_admin_username is defined
        - opensearch_admin_username is not none
        - opensearch_admin_password is defined
        - opensearch_admin_password is not none

- name: Copy elasticsearch-exporter systemd service file
  ansible.builtin.template:
    src: elasticsearch_exporter.service.jinja
    dest: /etc/systemd/system/elasticsearch_exporter.service
    owner: root
    group: root
    mode: 0644
  notify: Restart Elasticsearch exporter

- name: Start and enable elasticsearch-exporter service
  ansible.builtin.systemd:
    name: elasticsearch_exporter
    enabled: yes
    state: started
    daemon_reload: yes

- name: Delete temporary files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "/tmp/elasticsearch_exporter"
    - "/tmp/elasticsearch_exporter.tar.gz"
