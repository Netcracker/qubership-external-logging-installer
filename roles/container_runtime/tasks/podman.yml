---
- name: Check that Podman answers
  ansible.builtin.command: podman info --format '{{ "{{" }} .Version.Version {{ "}}" }}'
  register: container_runtime_podman_info
  changed_when: false
  failed_when: false

- name: Stop when Podman does not answer
  ansible.builtin.fail:
    msg: >-
      Cannot run podman: {{ container_runtime_podman_info.stderr | default('podman is not installed') }}.
      Install Podman, or set container_runtime_install to true.
  when: container_runtime_podman_info.rc | default(1) != 0

# Containers with restart_policy start again after a reboot only when this unit runs. A missing or masked unit fails
# the run, because the containers would stay down after a reboot.
- name: Enable the Podman restart service
  ansible.builtin.systemd_service:
    name: podman-restart
    enabled: true

- name: Create the Podman registry config directory
  ansible.builtin.file:
    path: /etc/containers/registries.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Allow Podman to use the registry without certificate checks
  ansible.builtin.copy:
    dest: /etc/containers/registries.conf.d/50-observability.conf
    content: |
      # Managed by the qubership.observability container_runtime role.
      [[registry]]
      location = "{{ container_runtime_registry }}"
      insecure = true
    owner: root
    group: root
    mode: "0644"
  when:
    - container_runtime_registry | length > 0
    - not container_runtime_registry_validate_certs | bool

# Also runs when the registry setting was cleared, so an earlier exception does not stay active.
- name: Remove the Podman insecure registry entry
  ansible.builtin.file:
    path: /etc/containers/registries.conf.d/50-observability.conf
    state: absent
  when: container_runtime_registry | length == 0 or container_runtime_registry_validate_certs | bool
