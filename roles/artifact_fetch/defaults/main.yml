---
# Base URL for artifact paths that are not full URLs, for example a mirror of GitHub releases.
# Full http:// or https:// URLs are used as they are.
artifact_fetch_base_url: "{{ observability_artifacts_url | default(raw_artifacts_registry | default('')) }}"

# Credentials for the artifact server. The role sends them only when both are set.
artifact_fetch_username: >-
  {{ observability_artifacts_username | default(raw_artifacts_registry_username | default('')) }}
artifact_fetch_password: >-
  {{ observability_artifacts_password | default(raw_artifacts_registry_password | default('')) }}

# Check the server certificate. The default is true, because the default URLs point at GitHub.
artifact_fetch_validate_certs: >-
  {{ observability_artifacts_validate_certs | default(raw_artifacts_registry_validate_certs | default(true)) | bool }}

# Path on the managed host to the CA certificate of the artifact server. Empty means the system trust store.
# When set, it replaces the trust store for the download, as SSL_CERT_FILE does.
artifact_fetch_ca_file: >-
  {{ observability_artifacts_ca_file | default(
       (ssl_data_host_path | default('/etc/logging/ssl')) ~ '/' ~ raw_artifacts_registry_ca_cert_file
       if raw_artifacts_registry_ca_cert_file | default('', true) | length > 0 else '') }}

# Seconds that one download may take, and how often to retry it.
artifact_fetch_timeout: 60
artifact_fetch_retries: 5
