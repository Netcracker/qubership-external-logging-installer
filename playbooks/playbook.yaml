---
# Deprecated: use playbooks/graylog.yml, or qubership.observability.graylog when the collection is installed.
# This file runs graylog.yml on all inventory hosts, as before, and is removed in a later release.
- name: Warn about the deprecated playbook path
  hosts: all
  gather_facts: false
  tasks:
    - name: Print the deprecation warning
      ansible.builtin.debug:
        msg: >-
          playbooks/playbook.yaml is deprecated and will be removed in a later release.
          Run playbooks/graylog.yml instead, and set graylog_target_hosts=all or put the hosts in the graylog group.
      run_once: true

- name: Deploy Graylog
  ansible.builtin.import_playbook: graylog.yml
  vars:
    graylog_target_hosts: all
